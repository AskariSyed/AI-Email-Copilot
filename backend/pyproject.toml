[tool.ruff]
line-length = 150
target-version = "py311"

[tool.ruff.lint]
ignore = [
    "B008",    # Do not perform function calls in argument defaults (used in FastAPI Depends)
    "BLE001",  # Do not catch blind exception (MVP exception handling)
    "RUF013",  # PEP 484 prohibits implicit Optional
    "SIM102",  # Use a single if statement instead of nested if statements
    "S110",    # try-except-pass
    "LOG015",  # Root logger error
    "G201",    # Logging .exception instead of .error
    "E722",    # Bare except
    "F841",    # Local variable is assigned to but never used
    "E402",    # Module level import not at top of file
    "UP015",   # Unnecessary mode argument
    "UP017",   # Use datetime.UTC alias
    "F401",    # Unused imports
    "RUF059",  # Unpacked variable state is never used
]
