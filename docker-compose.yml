version: '3.8'

services:
  db:
    image: ankane/pgvector:v0.5.1
    container_name: email_copilot_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-copilot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-copilot_password}
      POSTGRES_DB: ${POSTGRES_DB:-email_copilot}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: always

volumes:
  pgdata:
